<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Piano Admin</title>
<meta name="description" content="Hệ thống quản lý lớp học, học viên, điểm danh và công việc Marketing của One Piano.">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="One Piano">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="One Piano">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Unbounded:wght@400;600;700&display=swap">
<style>
/* Layout: dark footer-black sidebar (brand footer) + warm grey workspace; one orange accent; flat 8/12px cards; pill controls */
:root{
  --orange:#f26b22;        /* brand Main-color: shapes, charts, big numbers, active marks */
  --orange-2:#ff972f;      /* brand Main-color-3 */
  --orange-btn:#c24d12;    /* deeper brand orange for filled buttons: white text reaches 4.8:1 */
  --orange-ink:#b84a0f;    /* orange for small text */
  --orange-tint:#fff3e7;   /* Main-color-4 */
  --orange-wash:#fff9f3;   /* Main-color-5 */
  --peach:#ffd7ae;
  --ink:#363535;           /* Text-grey-color */
  --ink-2:#6a6a6a;
  --ink-3:#9b9b9b;
  --bg:#f7f7f7;
  --surface:#ffffff;
  --surface-2:#faf8f6;
  --line:#ece8e4;
  --border:#d9d9d9;
  --side:#0f0f0f;
  --side-ink:#d3d3d3;
  --side-hover:#1f1d1c;
  --ok:#287048; --ok-bg:#e6f4ec; --ok-dot:#2f9a5f;
  --info:#2c66a8; --info-bg:#e7f0fa; --info-dot:#3b82c9;
  --warn:#8a5a00; --warn-bg:#fdf1d6; --warn-dot:#e3a21a;
  --bad:#b3382b; --bad-bg:#fdeae7; --bad-dot:#d9493a;
  --wait:#55524f; --wait-bg:#eeecea; --wait-dot:#9b9b9b;
  --end:#ffffff; --end-bg:#4a4847; --end-dot:#bdbab7;
  --try:#b84a0f; --try-bg:#fff3e7; --try-dot:#f26b22;
  --chart-a:#363535; --chart-b:#f26b22; --chart-c:#ff972f; --chart-d:#ffd7ae; --grid:#ece8e4;
  --shadow:0 12px 32px -8px rgba(54,53,53,.22);
  --scrim:rgba(15,15,15,.42);
  --font-display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --font-sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-pill:1000px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --orange:#f26b22; --orange-2:#ff972f; --orange-btn:#c24d12; --orange-ink:#ff8a4c;
  --orange-tint:#3a2418; --orange-wash:#231a15; --peach:#6b3d22;
  --ink:#f1ece8; --ink-2:#c9c4bf; --ink-3:#8f8984;
  --bg:#141312; --surface:#1d1b1a; --surface-2:#232120; --line:#2f2c2a; --border:#3d3936;
  --side:#0a0a0a; --side-ink:#c9c4bf; --side-hover:#1d1b1a;
  --ok:#7fd3a2; --ok-bg:#16301f; --ok-dot:#3fb874;
  --info:#93c0ef; --info-bg:#152536; --info-dot:#5a9ee0;
  --warn:#f1c769; --warn-bg:#33270c; --warn-dot:#e3a21a;
  --bad:#f39a8f; --bad-bg:#3a1a16; --bad-dot:#e5594a;
  --wait:#c9c4bf; --wait-bg:#2c2927; --wait-dot:#8f8984;
  --end:#1d1b1a; --end-bg:#bdbab7; --end-dot:#6a6663;
  --try:#ff9a62; --try-bg:#3a2418; --try-dot:#f26b22;
  --chart-a:#d9d4cf; --chart-b:#f26b22; --chart-c:#ff972f; --chart-d:#7a4526; --grid:#2f2c2a;
  --shadow:0 12px 32px -8px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --orange:#f26b22; --orange-2:#ff972f; --orange-btn:#c24d12; --orange-ink:#ff8a4c;
  --orange-tint:#3a2418; --orange-wash:#231a15; --peach:#6b3d22;
  --ink:#f1ece8; --ink-2:#c9c4bf; --ink-3:#8f8984;
  --bg:#141312; --surface:#1d1b1a; --surface-2:#232120; --line:#2f2c2a; --border:#3d3936;
  --side:#0a0a0a; --side-ink:#c9c4bf; --side-hover:#1d1b1a;
  --ok:#7fd3a2; --ok-bg:#16301f; --ok-dot:#3fb874;
  --info:#93c0ef; --info-bg:#152536; --info-dot:#5a9ee0;
  --warn:#f1c769; --warn-bg:#33270c; --warn-dot:#e3a21a;
  --bad:#f39a8f; --bad-bg:#3a1a16; --bad-dot:#e5594a;
  --wait:#c9c4bf; --wait-bg:#2c2927; --wait-dot:#8f8984;
  --end:#1d1b1a; --end-bg:#bdbab7; --end-dot:#6a6663;
  --try:#ff9a62; --try-bg:#3a2418; --try-dot:#f26b22;
  --chart-a:#d9d4cf; --chart-b:#f26b22; --chart-c:#ff972f; --chart-d:#7a4526; --grid:#2f2c2a;
  --shadow:0 12px 32px -8px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:24px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand-row{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:28px;flex:none;fill:var(--orange)}
.brand-word{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1;color:#fff;letter-spacing:-.01em}
.brand-word span{color:var(--orange)}
.brand-sub{padding-left:36px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-ink);opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;padding:12px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-pill);color:var(--side-ink);text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.active{background:var(--orange-btn);color:#fff}
.nav a .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);border-radius:var(--r-pill);padding:1px 8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px 8px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .crumb{font-size:12px;color:var(--ink-2);margin-bottom:4px}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-date{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px;font-size:13px;color:var(--ink-2)}
.chip-date b{color:var(--ink);font-weight:600}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.view{padding-block:12px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{font-size:16px;font-weight:600;margin:0}
.card-h h2 em{font-style:normal;color:var(--orange-ink)}
.card-h p{margin:0;font-size:12px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-pill);padding:8px 18px;font-weight:600;font-size:14px;border:1px solid var(--orange-btn);cursor:pointer;background:var(--surface);color:var(--orange-ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--orange-tint)}
.btn-primary{background:var(--orange-btn);color:#fff}
.btn-primary:hover{background:var(--orange-ink);background:color-mix(in srgb,var(--orange-btn) 88%,#000)}
.btn-quiet{border-color:var(--border);color:var(--ink)}
.btn-quiet:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:var(--r-pill);font-weight:500;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:7px 14px;min-width:0}
.field svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.field input,.field select{border:0;background:transparent;outline:none;min-width:0;width:100%;font-size:13px}
select.sel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:7px 14px;font-size:13px;max-width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:3px 10px 3px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;flex:none}
.p-ok{color:var(--ok);background:var(--ok-bg)} .p-ok i{background:var(--ok-dot)}
.p-info{color:var(--info);background:var(--info-bg)} .p-info i{background:var(--info-dot)}
.p-warn{color:var(--warn);background:var(--warn-bg)} .p-warn i{background:var(--warn-dot)}
.p-bad{color:var(--bad);background:var(--bad-bg)} .p-bad i{background:var(--bad-dot)}
.p-wait{color:var(--wait);background:var(--wait-bg)} .p-wait i{background:var(--wait-dot)}
.p-end{color:var(--end);background:var(--end-bg)} .p-end i{background:var(--end-dot)}
.p-try{color:var(--try);background:var(--try-bg)} .p-try i{background:var(--try-dot)}
.tag{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 9px;color:var(--ink-2);white-space:nowrap}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:600;font-size:12px;width:32px;height:32px;flex:none;letter-spacing:.02em}
.av-0{background:var(--orange-tint);color:var(--orange-ink)}
.av-1{background:var(--ink);color:var(--surface)}
.av-2{background:var(--peach);color:var(--ink)}
.av-3{background:var(--wait-bg);color:var(--ink)}
.av-4{background:var(--orange-btn);color:#fff}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:500;display:block;white-space:nowrap}
.who small{color:var(--ink-2);font-size:12px;display:block}
.muted{color:var(--ink-2)}
.link{color:var(--orange-ink);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.stat .k{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.stat .v{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--ink-2)}
.stat.hero{background:var(--orange);border-color:var(--orange);color:#fff}
.stat.hero .k,.stat.hero .s{color:#fff;opacity:.92}
button.stat{cursor:pointer;font:inherit;color:inherit}
button.stat:hover{border-color:var(--border)}
button.stat.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--surface-2);position:sticky;top:0}
thead tr.grp th{background:var(--surface);border-bottom:0;padding-bottom:4px;font-size:11px;color:var(--ink)}
thead tr.grp th span{display:block;border-bottom:2px solid var(--ink);padding-bottom:6px}
thead tr.grp th.g-fee span{border-color:var(--orange)}
thead tr.grp th.g-more span{border-color:var(--ink-3)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--orange-wash)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.wrap{white-space:normal;min-width:180px}
.fill{display:flex;align-items:center;gap:8px;min-width:110px}
.bar{flex:1;height:6px;border-radius:var(--r-pill);background:var(--line);overflow:hidden;min-width:48px}
.bar span{display:block;height:100%;background:var(--orange);border-radius:inherit}
.disc{color:var(--orange-ink);font-weight:600}

/* grids */
.g2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.g2-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
svg text{fill:var(--ink-2);font-family:var(--font-sans);font-size:11px}
.hbars{display:flex;flex-direction:column;gap:12px}
.hrow{display:grid;grid-template-columns:120px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:13px}
.hrow .track{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.hrow .track span{height:100%}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{font-weight:500}

/* attendance */
.att th.s{text-align:center;min-width:56px;font-variant-numeric:tabular-nums}
.att th.s small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);font-size:11px}
.att th.s.today{background:var(--orange);color:#fff}
.att th.s.today small{color:#fff}
.att td.c{text-align:center;padding:6px}
.att tbody tr{cursor:default}
.att tbody tr:hover td{background:transparent}
.dot{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;border:0;cursor:pointer;font-size:12px;font-weight:600}
.dot.y{background:var(--ok-bg);color:var(--ok)}
.dot.n{background:var(--bad-bg);color:var(--bad)}
.dot.f{background:transparent;border:1px dashed var(--border);cursor:default}
.dot.y svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* roster */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.sc .ph{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--orange-wash);border-bottom:1px solid var(--line);position:relative}
.sc .ph .av{width:76px;height:76px;font-size:26px;font-family:var(--font-display)}
.sc .ph .pill{position:absolute;top:10px;left:10px}
.sc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.sc .bd b{font-weight:600}
.sc .bd .muted{font-size:12px}
.sc .bd .link{margin-top:8px;align-self:flex-start;font-size:13px}

/* profile */
.prof{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.idcard .top-band{background:var(--orange);height:84px}
.idcard .inner{padding:0 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:-44px}
.idcard .av{width:88px;height:88px;font-size:30px;font-family:var(--font-display);border:4px solid var(--surface)}
.idcard h3{font-size:18px;margin:6px 0 0;font-weight:600}
.kv{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);font-size:14px}
.kv div{padding:10px 0;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--ink-2)}
.kv div:nth-last-child(-n+2){border-bottom:0}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.strip i{width:14px;height:14px;border-radius:4px;background:var(--ok-dot)}
.strip i.n{background:var(--bad-dot)}
.strip i.f{background:var(--line)}
.meter{display:flex;align-items:baseline;gap:6px}
.meter b{font-family:var(--font-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(262px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;min-height:240px;transition:background .15s,border-color .15s}
.col.over{background:var(--orange-wash);border-color:var(--orange)}
.col-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:600;font-size:13px}
.col-h i{width:8px;height:8px;border-radius:50%}
.col-h .n{margin-left:auto;font-size:12px;color:var(--ink-2);font-weight:500}
.col-b{display:flex;flex-direction:column;gap:10px;padding:0 10px 12px;flex:1}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:10px;cursor:grab;text-align:left;width:100%}
.task:hover{border-color:var(--border);box-shadow:0 2px 10px -4px rgba(54,53,53,.25)}
.task.dragging{opacity:.45}
.task .t1{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-2);font-weight:600;letter-spacing:.03em}
.task .t1 .prio{margin-left:auto}
.task h4{margin:0;font-size:13px;font-weight:500;line-height:1.45;color:var(--ink)}
.task .t3{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.task .t3 .av{width:24px;height:24px;font-size:10px;margin-left:auto}
.task .due.late{color:var(--bad);font-weight:600}

function vbars(labels,vals,{h=200,hi=-1}={}){
  const W=narrow()?360:560,P={l:32,r:8,t:16,b:28},max=Math.max(...vals,1),top=Math.ceil(max/5)*5||5;
  const iw=W-P.l-P.r,ih=h-P.t-P.b,bw=iw/vals.length;
  let g='';for(let i=0;i<=4;i++){const y=P.t+ih-ih*i/4;g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${P.l-8}" y="${y+4}" text-anchor="end">${Math.round(top*i/4)}</text>`}
  vals.forEach((v,i)=>{const bh=ih*v/top,x=P.l+i*bw+bw*.2,y=P.t+ih-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.6}" height="${bh}" rx="4" fill="${i===hi?'var(--chart-b)':'var(--chart-a)'}"/>`;
    if(v)g+=`<text x="${x+bw*.3}" y="${y-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${v}</text>`;
    g+=`<text x="${x+bw*.3}" y="${h-8}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">${g}</svg>`;
}
function burndown(){
  const W=narrow()?360:560,H=narrow()?250:230,P={l:34,r:12,t:14,b:30};
  const sprint=TASKS.filter(t=>t.status!=='backlog');const total=sprint.reduce((a,t)=>a+t.pts,0)||1;
  const iw=W-P.l-P.r,ih=H-P.t-P.b,n=SPRINT.days-1;
  const x=i=>P.l+iw*i/n,y=v=>P.t+ih-ih*v/total;
  let g='';[0,.25,.5,.75,1].forEach(f=>{const v=Math.round(total*f);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${P.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  for(let i=0;i<=n;i+=(narrow()?3:2)){const d=new Date(SPRINT.start.getTime()+i*864e5);g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${sh(d)}</text>`}
  g+=`<line x1="${x(TODAY_IDX)}" x2="${x(TODAY_IDX)}" y1="${P.t}" y2="${P.t+ih}" stroke="var(--ink-3)" stroke-dasharray="3 4"/><text x="${x(TODAY_IDX)+6}" y="${P.t+10}" style="fill:var(--ink);font-weight:600">Hôm nay</text>`;
  g+=`<line x1="${x(0)}" y1="${y(total)}" x2="${x(n)}" y2="${y(0)}" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  const pts=[];for(let i=0;i<=Math.min(TODAY_IDX,n);i++){const done=sprint.filter(t=>t.status==='done'&&t.doneOn!=null&&t.doneOn<=i).reduce((a,t)=>a+t.pts,0);pts.push([x(i),y(total-done)])}
  const line=pts.map(p=>p.join(',')).join(' ');
  g+=`<polygon points="${pts[0][0]},${y(0)} ${line} ${pts[pts.length-1][0]},${y(0)}" fill="var(--orange)" opacity=".12"/>`;
  g+=`<polyline points="${line}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const last=pts[pts.length-1];g+=`<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--orange)" stroke="var(--surface)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ burndown sprint">${g}</svg>`;
}

function taskCard(t){const late=t.status!=='done'&&D(t.due)<TODAY;

R.marketing=()=>{
  const sprint=TASKS.filter(t=>t.status!=='backlog'),tot=sprint.reduce((a,t)=>a+t.pts,0),dn=sprint.filter(t=>t.status==='done').reduce((a,t)=>a+t.pts,0);
  const left=SPRINT.days-1-TODAY_IDX;const list=filtered();
  const board=COLS.map(c=>{const ts=list.filter(t=>t.status===c.k);return `<section class="col" data-col="${c.k}"><div class="col-h"><i style="background:${c.dot}"></i>${c.l}<span class="n num">${ts.length} · ${ts.reduce((a,t)=>a+t.pts,0)} đ</span></div><div class="col-b">${ts.map(taskCard).join('')}</div></section>`}).join('');
  const wl=TEAM.map(m=>{const mine=sprint.filter(t=>t.who===m.n);const by=k=>mine.filter(t=>t.status===k).reduce((a,t)=>a+t.pts,0);return {m,todo:by('todo'),doing:by('doing'),review:by('review'),done:by('done')}});
  const wmax=Math.max(...wl.map(w=>w.todo+w.doing+w.review+w.done),1);
  const wrows=wl.map(w=>`<div class="hrow wrow" style="grid-template-columns:150px minmax(0,1fr) 36px"><div class="who">${av(w.m.n)}<div style="min-width:0"><b style="font-size:13px;white-space:normal">${esc(w.m.n.split(' ').slice(-2).join(' '))}</b><small>${esc(w.m.r)}</small></div></div>
    <div class="track"><span style="width:${w.done/wmax*100}%;background:var(--ok-dot)"></span><span style="width:${w.review/wmax*100}%;background:var(--info-dot)"></span><span style="width:${w.doing/wmax*100}%;background:var(--orange)"></span><span style="width:${w.todo/wmax*100}%;background:var(--chart-d)"></span></div><b class="num">${w.todo+w.doing+w.review+w.done}</b></div>`).join('');
  const byType=TYPES.map(ty=>({ty,n:sprint.filter(t=>t.type===ty).reduce((a,t)=>a+t.pts,0)}));
  const late=TASKS.filter(t=>t.status!=='done'&&t.status!=='backlog'&&D(t.due)<TODAY).length;
  return `
  <div class="card"><div class="sprint">
    <div class="meta"><span class="muted" style="font-size:12px">Sprint hiện tại</span><b>${SPRINT.name}</b><span class="muted num" style="font-size:12px">${fmt(SPRINT.start)} – ${fmt(new Date(SPRINT.start.getTime()+(SPRINT.days-1)*864e5))} · còn ${left} ngày</span></div>
    <div class="progress"><div class="lbl"><span>${esc(SPRINT.goal)}</span><span class="num"><b>${dn}/${tot}</b> điểm</span></div><div class="bar"><span style="width:${dn/tot*100}%"></span></div></div>
    <button class="btn btn-primary" id="addtask">${ICON.plus}Thêm công việc</button>
  </div></div>
  <div class="stats">
    <div class="stat"><span class="k">Hoàn thành sprint</span><span class="v num">${Math.round(dn/tot*100)}%</span><span class="s">Theo kế hoạch cần ${Math.round(TODAY_IDX/(SPRINT.days-1)*100)}%</span></div>
    <div class="stat"><span class="k">Đang làm</span><span class="v num">${TASKS.filter(t=>t.status==='doing').length}</span><span class="s">${TASKS.filter(t=>t.status==='review').length} việc chờ duyệt</span></div>
    <div class="stat"><span class="k">Quá hạn</span><span class="v num" style="color:${late?'var(--bad)':'inherit'}">${late}</span><span class="s">chưa hoàn thành sau hạn chót</span></div>
    <div class="stat"><span class="k">Backlog</span><span class="v num">${TASKS.filter(t=>t.status==='backlog').length}</span><span class="s">việc chờ đưa vào sprint</span></div>
  </div>
  <div class="toolbar">
    <label class="field" style="flex:1;max-width:300px">${ICON.search}<input id="mq" placeholder="Tìm công việc hoặc mã MKT" value="${esc(S.mktQ)}"></label>
    <div class="avs" aria-label="Lọc theo người phụ trách">${TEAM.map(m=>`<button data-who="${esc(m.n)}" class="${S.mktWho.includes(m.n)?'on':S.mktWho.length?'dim':''}" title="${esc(m.n)}" aria-pressed="${S.mktWho.includes(m.n)}">${av(m.n)}</button>`).join('')}</div>
    <select class="sel" id="mepic" aria-label="Lọc theo chiến dịch"><option value="all">Mọi chiến dịch</option>${Object.entries(EPICS).map(([k,v])=>`<option value="${k}" ${S.mktEpic===k?'selected':''}>${esc(v)}</option>`).join('')}</select>
    ${S.mktQ||S.mktWho.length||S.mktEpic!=='all'?'<button class="link" id="mclear">Xoá bộ lọc</button>':''}
  </div>
  <div class="board" id="board">${board}</div>
  <p class="muted" style="margin:0;font-size:12px">Kéo thẻ sang cột khác để đổi trạng thái. Bấm vào thẻ để xem chi tiết, giao việc hoặc đổi trạng thái trên điện thoại.</p>
  <div class="g2">
    <div class="card"><div class="card-h"><h2>Burndown · ${SPRINT.name}</h2><div class="legend"><span><i style="background:var(--orange)"></i>Điểm còn lại</span><span><i style="background:var(--ink-3)"></i>Lý tưởng</span></div></div>${burndown()}</div>
    <div class="card"><div class="card-h"><h2>Khối lượng theo thành viên</h2><p>Story points trong sprint</p></div>
      <div class="hbars">${wrows}</div>
      <div class="legend" style="margin-top:14px"><span><i style="background:var(--ok-dot)"></i>Hoàn thành</span><span><i style="background:var(--info-dot)"></i>Đang duyệt</span><span><i style="background:var(--orange)"></i>Đang làm</span><span><i style="background:var(--chart-d)"></i>Cần làm</span></div>
    </div>
  </div>
  <div class="card"><div class="card-h"><h2>Phân bổ theo loại việc</h2><p>Story points trong sprint</p></div>${vbars(byType.map(b=>b.ty),byType.map(b=>b.n),{h:180,hi:byType.reduce((m,b,i,a)=>b.n>a[m].n?i:m,0)})}</div>`;
};

R.setup=()=>`<p class="muted" style="margin:0;max-width:70ch">Các danh mục dùng chung cho mọi bảng trong hệ thống. Thay đổi ở đây chỉ lưu trong phiên xem hiện tại của bản mẫu.</p>
  <div class="setup">${Object.entries(SETUP).map(([k,g])=>`<div class="card"><div class="card-h"><h2>${esc(g.t)}</h2><p class="num">${g.items.length} mục</p></div>
    <div class="chips">${g.items.map((it,i)=>`<span>${k==='status'?sp(Object.keys(ST)[i]):esc(it)}${g.locked?'':`<button data-rm="${k}" data-i="${i}" aria-label="Xoá ${esc(it)}">${ICON.x}</button>`}</span>`).join('')}</div>
    ${g.locked?'<p class="muted" style="font-size:12px;margin:12px 0 0">Trạng thái hệ thống, dùng để tính các báo cáo.</p>':`<form class="addrow" data-add="${k}"><input id="add-${k}" placeholder="Thêm mục mới" aria-label="Thêm vào ${esc(g.t)}"><button class="btn btn-quiet" type="submit">Thêm</button></form>`}</div>`).join('')}</div>`;

/* ---------- interactions ---------- */
let toastT;function toast(m){clearTimeout(toastT);$('#layer').querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;$('#layer').appendChild(t);toastT=setTimeout(()=>t.remove(),2200)}
view.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-cf]')){S.clsFilter=el.dataset.cf;render();return}
  if(el=t.closest('[data-sf]')){S.stuFilter=el.dataset.sf;render();return}
  if(el=t.closest('[data-att]')){const s=STU[el.dataset.att],i=+el.dataset.i;s.att[i]=!s.att[i];const y=window.scrollY;render();window.scrollTo(0,y);toast(`${s.name}: buổi ${i+1} ${s.att[i]?'có mặt':'vắng'}`);return}
  if(el=t.closest('[data-who]')){const w=el.dataset.who;S.mktWho=S.mktWho.includes(w)?S.mktWho.filter(x=>x!==w):S.mktWho.concat(w);render();return}
  if(t.closest('#mclear')){S.mktQ='';S.mktWho=[];S.mktEpic='all';render();return}
  if(t.closest('#addtask')){openTask(null);return}
  if(el=t.closest('[data-task]')){openTask(el.dataset.task);return}
  if(el=t.closest('[data-rm]')){SETUP[el.dataset.rm].items.splice(+el.dataset.i,1);render();return}
});
view.addEventListener('keydown',e=>{const el=e.target.closest('[data-task]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(el.dataset.task)}});
view.addEventListener('submit',e=>{const f=e.target.closest('[data-add]');if(!f)return;e.preventDefault();const k=f.dataset.add,inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;SETUP[k].items.push(v);render();toast('Đã thêm "'+v+'"')});
view.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='clsq'||id==='stuq'||id==='mq'){const pos=e.target.selectionStart;if(id==='clsq')S.clsQ=e.target.value;if(id==='stuq')S.stuQ=e.target.value;if(id==='mq')S.mktQ=e.target.value;render();const n=document.getElementById(id);n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
view.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='attcls'){S.attCls=v;render()}
  if(id==='rcls'){S.rosterCls=v;render()}
  if(id==='rst'){S.rosterSt=v;render()}
  if(id==='pf'){S.profile=v;render()}
  if(id==='mepic'){S.mktEpic=v;render()}
});

function moveTask(key,to){const t=TASKS.find(x=>x.key===key);if(!t||t.status===to)return;
  t.status=to;t.doneOn=to==='done'?Math.min(Math.max(TODAY_IDX,0),SPRINT.days-1):null;saveTasks();render();
  toast(`${t.key} chuyển sang "${COLS.find(c=>c.k===to).l}"`)}
function bindBoard(){
  const b=$('#board');if(!b)return;let dragKey=null;
  b.querySelectorAll('.task').forEach(c=>{
    c.addEventListener('dragstart',e=>{dragKey=c.dataset.task;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragKey);e.dataTransfer.effectAllowed='move'}catch(_){}});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');b.querySelectorAll('.col').forEach(x=>x.classList.remove('over'))});
  });
  b.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('over')});
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');let k=dragKey;try{k=e.dataTransfer.getData('text/plain')||k}catch(_){}if(k)moveTask(k,col.dataset.col)});
  });
}

function openTask(key){
  const isNew=!key;const t=isNew?{key:'MKT-'+(Math.max(...TASKS.map(x=>+x.key.split('-')[1]))+1),title:'',type:'Content',who:TEAM[0].n,prio:'med',pts:3,status:'todo',due:'30/10/2026',epic:'e1',doneOn:null,desc:''}:TASKS.find(x=>x.key===key);
  const iso=d=>{const x=D(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
  const o=(arr,cur)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('');
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><form class="drawer" id="tform" role="dialog" aria-modal="true" aria-label="${isNew?'Thêm công việc':'Chi tiết công việc'}">
    <div style="display:flex;align-items:center;gap:10px"><span class="tag">${t.key}</span>${isNew?'<b>Công việc mới</b>':`<span class="epic">${esc(EPICS[t.epic])}</span>`}<button type="button" class="x" id="tclose" aria-label="Đóng">${ICON.x}</button></div>
    ${isNew?'':`<h3>${esc(t.title)}</h3>`}
    <div class="form">
      ${isNew?`<label class="full">Tên công việc<input id="f-title" required placeholder="Ví dụ: Bài đăng mở lớp Nhóm K25"></label>`:''}
      <label>Trạng thái<select id="f-status">${o(COLS.map(c=>[c.k,c.l]),t.status)}</select></label>
      <label>Người phụ trách<select id="f-who">${o(TEAM.map(m=>[m.n,m.n]),t.who)}</select></label>
      <label>Ưu tiên<select id="f-prio">${o(Object.entries(PRIO),t.prio)}</select></label>
      <label>Story points<select id="f-pts">${o([1,2,3,5,8,13].map(n=>[String(n),String(n)]),String(t.pts))}</select></label>
      <label>Loại việc<select id="f-type">${o(TYPES.map(x=>[x,x]),t.type)}</select></label>
      <label>Hạn chót<input id="f-due" type="date" value="${iso(t.due)}"></label>
      <label class="full">Chiến dịch<select id="f-epic">${o(Object.entries(EPICS),t.epic)}</select></label>
      <label class="full">Ghi chú<textarea id="f-desc" placeholder="Mô tả, link tài liệu, yêu cầu brand…">${esc(t.desc)}</textarea></label>
    </div>
    <div style="display:flex;gap:10px;margin-top:auto"><button class="btn btn-primary" type="submit">${isNew?'Tạo công việc':'Lưu thay đổi'}</button><button class="btn btn-quiet" type="button" id="tcancel">Huỷ</button></div>
  </form></div>`;
  const close=()=>{$('#layer').innerHTML=''};
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  $('#tclose').onclick=close;$('#tcancel').onclick=close;
  document.addEventListener('keydown',function esc_(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc_)}});
  (isNew?$('#f-title'):$('#f-status')).focus();
  $('#tform').addEventListener('submit',e=>{e.preventDefault();
    const g=id=>document.getElementById(id).value;
    if(isNew){const title=g('f-title').trim();if(!title){$('#f-title').focus();return}t.title=title;TASKS.push(t)}
    const was=t.status;Object.assign(t,{status:g('f-status'),who:g('f-who'),prio:g('f-prio'),pts:+g('f-pts'),type:g('f-type'),epic:g('f-epic'),desc:g('f-desc')});
    const dv=g('f-due');if(dv){const[y,m,d]=dv.split('-');t.due=d+'/'+m+'/'+y}
    if(t.status==='done'&&was!=='done')t.doneOn=Math.min(Math.max(TODAY_IDX,0),SPRINT.days-1);if(t.status!=='done')t.doneOn=null;
    saveTasks();close();render();toast(isNew?'Đã tạo '+t.key:'Đã lưu '+t.key)});
}

/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);
go(VIEWS.some(v=>v.k===h)?h:'dashboard');
})();
</script>

</body>
</html>
